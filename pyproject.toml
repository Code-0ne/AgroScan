[project]
name = "AgroScan"
version = "0.1.0"
description = "FastAPI backend for Crop Doctor — leaf disease diagnosis"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["main.py", "treatments.py"]
