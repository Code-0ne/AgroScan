[project]
name = "crop-doctor-backend"
version = "0.1.0"
description = "FastAPI backend for Crop Doctor — leaf disease diagnosis"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "transformers==4.44.2",
    "torch==2.4.1",
    "pillow==10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["main.py", "treatments.py"]
