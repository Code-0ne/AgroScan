[project]
name = "AgroScan"
version = "0.1.0"
description = "FastAPI backend for Crop Doctor — leaf disease diagnosis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<0.116.0",
    "httpx>=0.26.0,<0.28.0",
    "pillow>=10.0.0,<11.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.6,<0.1.0",
    "torch>=2.1.0,<2.5.0",
    "torchvision>=0.16.0,<0.20.0",
    "transformers>=4.36.0,<4.45.0",
    "uvicorn>=0.27.0,<0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["main.py", "treatments.py"]
