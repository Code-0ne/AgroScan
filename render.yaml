services:
  - type: web
    name: agroscan
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend && uv sync --frozen
      cd ../frontend && npm ci && npm run build
    startCommand: cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: HF_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true